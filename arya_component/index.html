<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;overflow:hidden;color:#d7def0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
    background:radial-gradient(ellipse at 50% 42%,#14203f 0%,#0a0e1c 55%,#04050a 100%)}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  #status{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.38em;text-transform:uppercase;opacity:.75}
  #dock{position:absolute;left:5%;right:5%;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:9px}
  #caption{font-size:14px;line-height:1.45;text-align:center;opacity:.92;min-height:20px;max-width:760px;text-shadow:0 0 12px #000}
  .row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
  button,select,input[type=text]{background:rgba(255,255,255,.06);color:#d7def0;border:1px solid rgba(255,255,255,.13);
    border-radius:999px;padding:8px 14px;font-size:13px;outline:none;backdrop-filter:blur(8px)}
  button,select{cursor:pointer;max-width:220px}
  button:hover,select:hover,input[type=text]:focus{border-color:var(--accent,#4dc3ff);box-shadow:0 0 14px -2px var(--accent,#4dc3ff)}
  button.on{background:var(--accent,#4dc3ff);color:#04101c;border-color:transparent}
  input[type=text]{flex:1;min-width:180px;max-width:520px;padding:10px 16px}
  input::placeholder{color:#7d89a8}
  label{font-size:12px;opacity:.85;display:flex;gap:6px;align-items:center;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">Arya · ready</div>
<div id="dock">
  <div id="caption"></div>
  <div class="row">
    <input type="text" id="txt" placeholder="Type to Arya, or press Talk…" autocomplete="off">
    <button id="send">➤ Send</button>
  </div>
  <div class="row">
    <button id="mic">🎤 Talk</button>
    <button id="stop">⏹ Stop</button>
    <select id="voice" title="Voice"></select>
    <label><input type="checkbox" id="auto"> Hands-free</label>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Streamlit component protocol ----------
function send(type, data){ window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, data||{}), "*"); }
function setValue(v){ send("streamlit:setComponentValue", {value:v, dataType:"json"}); }
function setHeight(h){ send("streamlit:setFrameHeight", {height:h}); }

let args = {state:"idle", mood:"neutral", lang:"en-US", speak:null, preset:{rate:1,pitch:1,volume:1}, speed:1};
let firstRender = true, lastSpokenId = null, listening = false, speaking = false;
const $ = id => document.getElementById(id);

// ---------- 3D scene ----------
const PR = Math.min(window.devicePixelRatio || 1, 2);
const renderer = new THREE.WebGLRenderer({canvas:$("c"), antialias:true, alpha:true});
renderer.setPixelRatio(PR); renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.z = 6.4;

const U = {
  uTime:{value:0}, uAmp:{value:0.05}, uPR:{value:PR},
  uA:{value:new THREE.Color(0x4dc3ff)}, uB:{value:new THREE.Color(0x8a5cff)}
};
const ADD = THREE.AdditiveBlending;

const NOISE = `
float hash(vec3 p){ p = fract(p*0.3183099+vec3(0.1)); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise(vec3 x){
  vec3 i = floor(x); vec3 f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i+vec3(0.0,0.0,0.0)),hash(i+vec3(1.0,0.0,0.0)),f.x),
                 mix(hash(i+vec3(0.0,1.0,0.0)),hash(i+vec3(1.0,1.0,0.0)),f.x),f.y),
             mix(mix(hash(i+vec3(0.0,0.0,1.0)),hash(i+vec3(1.0,0.0,1.0)),f.x),
                 mix(hash(i+vec3(0.0,1.0,1.0)),hash(i+vec3(1.0,1.0,1.0)),f.x),f.y),f.z);
}`;

// 1) Particle shell — a living, noise-displaced sphere of ~6000 glowing points
function fibSphere(n){
  const pos = new Float32Array(n*3), rnd = new Float32Array(n), g = Math.PI*(3-Math.sqrt(5));
  for (let i=0;i<n;i++){
    const y = 1 - (i/(n-1))*2, r = Math.sqrt(1-y*y), th = g*i;
    pos[i*3]=Math.cos(th)*r; pos[i*3+1]=y; pos[i*3+2]=Math.sin(th)*r; rnd[i]=Math.random();
  }
  return {pos, rnd};
}
const fs = fibSphere(6000);
const shellGeo = new THREE.BufferGeometry();
shellGeo.setAttribute("position", new THREE.BufferAttribute(fs.pos, 3));
shellGeo.setAttribute("aRand", new THREE.BufferAttribute(fs.rnd, 1));
const shell = new THREE.Points(shellGeo, new THREE.ShaderMaterial({
  uniforms:U, transparent:true, depthWrite:false, blending:ADD,
  vertexShader: NOISE + `
    uniform float uTime; uniform float uAmp; uniform float uPR;
    attribute float aRand; varying float vN; varying float vR;
    void main(){
      vec3 n = normalize(position);
      float ns = noise(n*2.0 + vec3(0.0, uTime*0.45, uTime*0.3));
      float d = (ns-0.5)*(0.30+uAmp*1.2);
      vec3 p = n*(1.35+d);
      vN = ns; vR = aRand;
      vec4 mv = modelViewMatrix*vec4(p,1.0);
      gl_PointSize = (1.8+aRand*2.2+uAmp*3.0)*uPR*(6.4/-mv.z);
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader: `
    uniform vec3 uA; uniform vec3 uB; varying float vN; varying float vR;
    void main(){
      float r = length(gl_PointCoord-vec2(0.5));
      if (r > 0.5) discard;
      float a = pow(1.0-r*2.0, 1.6);
      vec3 c = mix(uA, uB, smoothstep(0.25,0.75,vN)) + vec3(vR*0.25);
      gl_FragColor = vec4(c, a);
    }`
}));
shell.frustumCulled = false;

// 2) Plasma core with fresnel rim
const core = new THREE.Mesh(new THREE.SphereGeometry(0.95, 64, 64), new THREE.ShaderMaterial({
  uniforms:U, transparent:true, depthWrite:false, blending:ADD,
  vertexShader: `
    varying vec3 vN; varying vec3 vP;
    void main(){ vN = normalize(normalMatrix*normal); vP = position;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: NOISE + `
    uniform float uTime; uniform float uAmp; uniform vec3 uA; uniform vec3 uB;
    varying vec3 vN; varying vec3 vP;
    void main(){
      float f = pow(1.0 - abs(dot(normalize(vN), vec3(0.0,0.0,1.0))), 2.5);
      float pl = noise(vP*3.0 + vec3(uTime*0.6))*0.6 + noise(vP*6.5 - vec3(uTime*0.9))*0.4;
      vec3 col = mix(uA, uB, pl)*(0.55+pl*1.1) + uB*f*1.4;
      gl_FragColor = vec4(col, 0.30 + f*0.6 + uAmp*0.35);
    }`
}));

// 3) Outer atmospheric glow
const glow = new THREE.Mesh(new THREE.SphereGeometry(1.95, 48, 48), new THREE.ShaderMaterial({
  uniforms:U, transparent:true, depthWrite:false, blending:ADD, side:THREE.BackSide,
  vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal);
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform vec3 uA; uniform float uAmp; varying vec3 vN;
    void main(){ float i = pow(max(0.0, 0.62 - dot(vN, vec3(0.0,0.0,1.0))), 3.0);
      gl_FragColor = vec4(uA*1.6, i*(0.9+uAmp)); }`
}));

// 4) Orbiting particle halo (swirls faster when active)
const HN = 2600, hpos = new Float32Array(HN*3), hAng = new Float32Array(HN), hRad = new Float32Array(HN),
      hY = new Float32Array(HN), hRnd = new Float32Array(HN);
for (let i=0;i<HN;i++){
  hAng[i]=Math.random()*Math.PI*2; hRad[i]=2.0+Math.pow(Math.random(),1.6)*1.1;
  hY[i]=(Math.random()-0.5)*0.14; hRnd[i]=Math.random();
}
const haloGeo = new THREE.BufferGeometry();
haloGeo.setAttribute("position", new THREE.BufferAttribute(hpos, 3));
haloGeo.setAttribute("aAng", new THREE.BufferAttribute(hAng, 1));
haloGeo.setAttribute("aRad", new THREE.BufferAttribute(hRad, 1));
haloGeo.setAttribute("aY", new THREE.BufferAttribute(hY, 1));
haloGeo.setAttribute("aRand", new THREE.BufferAttribute(hRnd, 1));
const halo = new THREE.Points(haloGeo, new THREE.ShaderMaterial({
  uniforms:U, transparent:true, depthWrite:false, blending:ADD,
  vertexShader: `
    uniform float uTime; uniform float uAmp; uniform float uPR;
    attribute float aAng; attribute float aRad; attribute float aY; attribute float aRand; varying float vR;
    void main(){
      float a = aAng + uTime*(0.35/aRad)*(1.0+uAmp*2.5);
      vec3 p = vec3(cos(a)*aRad, aY + sin(a*3.0+uTime)*0.06*(1.0+uAmp*5.0), sin(a)*aRad);
      vR = aRand;
      vec4 mv = modelViewMatrix*vec4(p,1.0);
      gl_PointSize = (1.2+aRand*1.8)*uPR*(6.4/-mv.z);
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader: `
    uniform vec3 uA; uniform vec3 uB; varying float vR;
    void main(){
      float r = length(gl_PointCoord-vec2(0.5));
      if (r > 0.5) discard;
      gl_FragColor = vec4(mix(uB, uA, vR), pow(1.0-r*2.0, 1.4)*0.85);
    }`
}));
halo.frustumCulled = false;
halo.rotation.x = 1.15; halo.rotation.z = 0.25;

// 5) Voice ring — a reactive waveform loop around the orb
const RN = 256, rpos = new Float32Array(RN*3), rgeo = new THREE.BufferGeometry();
rgeo.setAttribute("position", new THREE.BufferAttribute(rpos, 3));
const rmat = new THREE.LineBasicMaterial({color:0x4dc3ff, transparent:true, opacity:0.95, blending:ADD});
const voiceRing = new THREE.LineLoop(rgeo, rmat); voiceRing.frustumCulled = false;

// 6) Dashed HUD rings
function dashedRing(radius, opacity){
  const pts = []; for (let i=0;i<=160;i++){ const a=i/160*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*radius, Math.sin(a)*radius, 0)); }
  const m = new THREE.LineDashedMaterial({color:0x4dc3ff, dashSize:0.14, gapSize:0.09, transparent:true, opacity:opacity, blending:ADD});
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), m); l.computeLineDistances(); return l;
}
const hudA = dashedRing(2.6, 0.5), hudB = dashedRing(3.05, 0.3);
hudB.rotation.x = 1.0; hudA.rotation.y = 0.5;

// 7) Starfield
const SN = 700, spos = new Float32Array(SN*3);
for (let i=0;i<SN;i++){
  const r = 9+Math.random()*8, th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
  spos[i*3]=r*Math.sin(ph)*Math.cos(th); spos[i*3+1]=r*Math.cos(ph)*0.6; spos[i*3+2]=r*Math.sin(ph)*Math.sin(th)-4;
}
const sgeo = new THREE.BufferGeometry(); sgeo.setAttribute("position", new THREE.BufferAttribute(spos, 3));
const stars = new THREE.Points(sgeo, new THREE.PointsMaterial({color:0x8fa3d6, size:0.05, transparent:true, opacity:0.55}));

const rig = new THREE.Group();
rig.add(shell, core, glow, halo, voiceRing, hudA, hudB);
scene.add(stars, rig);

const MOODS = {
  neutral:[0x4dc3ff,0x8a5cff], joy:[0xffc94d,0xff5fa2], sadness:[0x4d7cff,0x6b4dff],
  anger:[0xff5a4d,0xffa04d], fear:[0xa46bff,0xff5fd2], disgust:[0x6bd66b,0x2fd3c0], surprise:[0x4de0ff,0xb6ff5f]
};
let tA = new THREE.Color(MOODS.neutral[0]), tB = new THREE.Color(MOODS.neutral[1]);
let amp = 0.05, pulse = 0, mx = 0, my = 0, tx = 0, ty = 0;

window.addEventListener("pointermove", e => { tx = (e.clientX/window.innerWidth-0.5)*2; ty = (e.clientY/window.innerHeight-0.5)*2; });
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  rig.position.y = 0.45;   // lift the orb above the dock
}
window.addEventListener("resize", resize); resize();

function currentState(){
  if (speaking) return "speaking";
  if (listening) return "listening";
  if (args.state === "thinking") return "thinking";
  return "idle";
}

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime(), s = currentState();
  U.uTime.value = t * (s === "thinking" ? 2.6 : 1.0);

  let target = 0.05 + 0.03*Math.sin(t*1.2);
  if (s === "listening") target = 0.20 + 0.12*Math.abs(Math.sin(t*5.0)*Math.sin(t*2.3));
  if (s === "thinking")  target = 0.28 + 0.08*Math.sin(t*8.0);
  if (s === "speaking")  target = 0.24 + 0.15*Math.abs(Math.sin(t*7.0)*Math.sin(t*3.1)) + pulse;
  pulse *= 0.9; amp += (target-amp)*0.08; U.uAmp.value = amp;

  U.uA.value.lerp(tA, 0.04); U.uB.value.lerp(tB, 0.04);
  rmat.color.copy(U.uA.value); hudA.material.color.copy(U.uA.value); hudB.material.color.copy(U.uB.value);
  document.documentElement.style.setProperty("--accent", "#" + U.uA.value.getHexString());

  // voice ring displacement
  const speed = s === "thinking" ? 4.0 : 2.0;
  for (let i=0;i<RN;i++){
    const a = i/RN*Math.PI*2;
    const k = (Math.sin(a*6+t*speed) + Math.sin(a*11-t*speed*1.55) + Math.sin(a*3+t*0.65*speed))/3;
    const r = 2.3 + k*amp*0.9;
    rpos[i*3]=Math.cos(a)*r; rpos[i*3+1]=Math.sin(a)*r; rpos[i*3+2]=0;
  }
  rgeo.attributes.position.needsUpdate = true;

  mx += (tx-mx)*0.05; my += (ty-my)*0.05;
  rig.rotation.y = mx*0.5; rig.rotation.x = my*0.3;
  shell.rotation.y = t*0.12; shell.rotation.x = t*0.05;
  core.scale.setScalar(1 + amp*0.45);
  hudA.rotation.z = t*0.25; hudB.rotation.z = -t*0.18;
  stars.rotation.y = t*0.01;
  camera.position.x = Math.sin(t*0.2)*0.25; camera.lookAt(0, 0.3, 0);

  const label = {idle:"Arya · ready", listening:"Listening…", thinking:"Thinking…", speaking:"Speaking…"}[s];
  if ($("status").textContent !== label) $("status").textContent = label;
  renderer.render(scene, camera);
}
animate();

// ---------- Speech output ----------
const synth = window.speechSynthesis;
let voices = [];
function loadVoices(){
  voices = synth ? synth.getVoices() : [];
  const base = (args.lang||"en-US").split("-")[0].toLowerCase(), sel = $("voice"), prev = sel.value;
  sel.innerHTML = "";
  const m = voices.filter(v => v.lang.toLowerCase().startsWith(base));
  (m.length ? m : voices).forEach(v => {
    const o = document.createElement("option"); o.value = v.name;
    o.textContent = v.name.replace(/Microsoft |Google /,"") + " (" + v.lang + ")"; sel.appendChild(o);
  });
  if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
}
if (synth) synth.onvoiceschanged = loadVoices;
function stopSpeak(){ if (synth) synth.cancel(); speaking = false; }
function speak(text){
  if (!synth || !text) return;
  stopSpeak();
  const chunks = text.split(/(?<=[.!?।。！？])\s+/).filter(Boolean);
  const v = voices.find(x => x.name === $("voice").value);
  chunks.forEach((c, i) => {
    const u = new SpeechSynthesisUtterance(c);
    u.lang = args.lang; if (v) u.voice = v;
    u.rate = Math.min(2, Math.max(0.5, args.preset.rate*args.speed));
    u.pitch = Math.min(2, Math.max(0, args.preset.pitch));
    u.volume = Math.min(1, Math.max(0, args.preset.volume));
    u.onstart = () => { speaking = true; };
    u.onboundary = () => { pulse = 0.35; };
    if (i === chunks.length-1) u.onend = u.onerror = () => {
      speaking = false; if ($("auto").checked) setTimeout(startListening, 350);
    };
    synth.speak(u);
  });
}

// ---------- Input: voice + typing ----------
function submitText(text){
  text = (text||"").trim(); if (!text) return;
  stopSpeak(); if (rec && listening) rec.stop();
  args.state = "thinking";
  $("caption").textContent = "“" + text + "”";
  setValue({id: Date.now()+"-"+Math.random().toString(36).slice(2), text});
}
$("send").onclick = () => { submitText($("txt").value); $("txt").value = ""; };
$("txt").addEventListener("keydown", e => { if (e.key === "Enter") { submitText($("txt").value); $("txt").value = ""; } });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function startListening(){
  if (!SR) { $("caption").textContent = "Voice input needs Chrome or Edge — typing still works."; return; }
  if (listening || args.state === "thinking") return;
  stopSpeak();
  rec = new SR(); rec.lang = args.lang; rec.interimResults = true; rec.continuous = false;
  rec.onstart = () => { listening = true; $("mic").classList.add("on"); };
  rec.onresult = e => {
    let interim = "", fin = "";
    for (let i=e.resultIndex;i<e.results.length;i++) (e.results[i].isFinal ? (fin += e.results[i][0].transcript) : (interim += e.results[i][0].transcript));
    $("caption").textContent = "“" + (fin||interim) + "”";
    if (fin.trim()) submitText(fin);
  };
  rec.onerror = e => { if (e.error === "not-allowed") $("caption").textContent = "Microphone blocked — allow it in the browser address bar."; };
  rec.onend = () => { listening = false; $("mic").classList.remove("on"); };
  try { rec.start(); } catch(e) {}
}
$("mic").onclick = () => { listening ? (rec && rec.stop()) : startListening(); };
$("stop").onclick = () => { stopSpeak(); if (rec && listening) rec.stop(); $("auto").checked = false; };

// ---------- Render hook ----------
window.addEventListener("message", e => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  args = Object.assign(args, e.data.args || {});
  const m = MOODS[args.mood] || MOODS.neutral;
  tA = new THREE.Color(m[0]); tB = new THREE.Color(m[1]);
  loadVoices();
  const sp = args.speak;
  if (sp && sp.id !== lastSpokenId) {
    lastSpokenId = sp.id;
    if (!firstRender) { $("caption").textContent = sp.text.length > 220 ? sp.text.slice(0,217)+"…" : sp.text; speak(sp.text); }
  }
  firstRender = false;
  setHeight(580);
});
send("streamlit:componentReady", {apiVersion: 1});
setHeight(580);
</script>
</body>
</html>
